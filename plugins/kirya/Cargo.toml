[package]
name = "ppc_kirya"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kirya Dattorro plate reverb"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
rt-audit = ["musictools-core/alloc-audit"]
# VST3 export; off for now, so bundles are CLAP-only. The bundler emits a
# format only when the library exports it.
vst3 = []

[dependencies]
musictools-core = { workspace = true }
kirya-dsp = { workspace = true }
neon-ui = { workspace = true, features = ["nice-plug"] }
nice-plug = { workspace = true }
nice-plug-egui = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
audio-harness = { workspace = true }

[lints]
workspace = true
