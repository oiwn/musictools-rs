[package]
name = "ppc_bogdan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Bogdan detail-preserving clipper"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
rt-audit = ["musictools-core/alloc-audit"]

[dependencies]
musictools-core = { workspace = true }
bogdan-dsp = { workspace = true }
neon-ui = { workspace = true, features = ["nice-plug"] }
nice-plug = { workspace = true }
nice-plug-egui = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
audio-harness = { workspace = true }

[lints]
workspace = true
