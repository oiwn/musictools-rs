[workspace]
resolver = "3"
members = [
    "crates/musictools-core",
    "crates/neon-ui",
    "crates/audio-harness",
    "crates/bogdan-dsp",
    "crates/kirya-dsp",
    "crates/igorek-dsp",
    "crates/roman-dsp",
    "crates/box-core",
    "crates/box-dsp",
    "crates/box-modules",
    "crates/box-app",
    "plugins/bogdan",
    "plugins/kirya",
]
default-members = [
    "crates/musictools-core",
    "crates/neon-ui",
    "crates/audio-harness",
    "crates/bogdan-dsp",
    "crates/kirya-dsp",
    "crates/igorek-dsp",
    "crates/roman-dsp",
    "crates/box-core",
    "crates/box-dsp",
    "crates/box-modules",
    "crates/box-app",
    "plugins/bogdan",
    "plugins/kirya",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["oiwn <blank@gmail.com>"]
license = "MIT"
repository = "https://github.com/oiwn/musictools-rs"

[workspace.dependencies]
musictools-core = { path = "crates/musictools-core" }
bogdan-dsp = { path = "crates/bogdan-dsp" }
kirya-dsp = { path = "crates/kirya-dsp" }
igorek-dsp = { path = "crates/igorek-dsp" }
neon-ui = { path = "crates/neon-ui" }
audio-harness = { path = "crates/audio-harness" }
box-core = { path = "crates/box-core" }
box-dsp = { path = "crates/box-dsp" }
box-modules = { path = "crates/box-modules" }
roman-dsp = { path = "crates/roman-dsp" }
cpal = "0.18"
eframe = "0.37"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
hound = "3.5"
rand = "0.9"
nice-plug = "0.4"
nice-plug-egui = "0.6"
# default_fonts is not a default feature in egui 0.37; eframe re-enables it
# for the showcase, but the plugin path (nice-plug-egui / egui-baseview)
# ships without fonts unless we enable it here.
egui = { version = "0.37", features = ["default_fonts"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
